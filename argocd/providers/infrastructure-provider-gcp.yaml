# Provider infra GCP (CAPG, v1.8.x). configSecret pointe vers le Secret
# capi-variables deja cree dans capi-operator-system (GCP_B64ENCODED_CREDENTIALS,
# GCP_PROJECT, etc. selon le format attendu par CAPG). Adapter la version si
# une version differente est deja validee.
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: InfrastructureProvider
metadata:
  name: gcp
  namespace: capi-operator-system
spec:
  version: v1.8.2-dns.2
  fetchConfig:
    selector:
      matchLabels:
        provider-components: gcp-dns-recreation
  configSecret:
    name: capi-variables
  deployment:
    containers:
      - name: manager
        imageUrl: europe-west1-docker.pkg.dev/k8s-formation/k8s-lab/capg-dns-endpoint@sha256:564de73b9741e318615b1abedebce5b8c36d9aa3d7b464f07215e26ea2d5fa5b
