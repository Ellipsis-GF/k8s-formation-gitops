# Argo CD gere les noms et labels des enregistrements existants.
# data.config (authentification) reste fourni hors Git ; CAPG met a jour
# data.server via argoCDClusterSecretRef lors des recreations GKE.
# Pas de migration du kubectl apply initial : ses credentials sont preserves.
# Conserver ces Secrets au retrait de l'Application ou d'un manifeste.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-cluster-a
  namespace: argocd-greg
  labels:
    argocd.argoproj.io/secret-type: cluster
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
data:
  name: Y2x1c3Rlci1h # cluster-a
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-cluster-b
  namespace: argocd-greg
  labels:
    argocd.argoproj.io/secret-type: cluster
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
data:
  name: Y2x1c3Rlci1i # cluster-b
