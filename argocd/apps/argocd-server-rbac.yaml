apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-rbac
  namespace: argocd-greg
spec:
  project: default
  source:
    repoURL: git@github.com:Ellipsis-GF/k8s-formation-gitops.git
    targetRevision: main
    path: argocd/argocd-server-rbac
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true