# Cree 2 clusters GKE manages (cluster-a, cluster-b) via CAPI/CAPG, pilotes
# par les CR Provider de cluster-api-providers (coreprovider + infra gcp).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-api-workload-clusters
  namespace: argocd-greg
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: git@github.com:Ellipsis-GF/k8s-formation-gitops.git
    targetRevision: main
    path: argocd/clusters
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  ignoreDifferences:
    - group: cluster.x-k8s.io
      kind: Cluster
      jsonPointers:
        - /spec/controlPlaneEndpoint
    - group: infrastructure.cluster.x-k8s.io
      kind: GCPManagedControlPlane
      jsonPointers:
        - /spec/endpoint
    - group: infrastructure.cluster.x-k8s.io
      kind: GCPManagedCluster
      jsonPointers:
        - /spec/controlPlaneEndpoint
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
