# Cree 2 clusters GKE manages (cluster-a, cluster-b) via CAPI/CAPG, pilotes
# par les CR Provider de cluster-api-providers (coreprovider + infra gcp).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-api-workload-clusters
  namespace: argocd-greg
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: git@github.com:Ellipsis-GF/k8s-formation-gitops.git
    targetRevision: main
    path: argocd/clusters
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
