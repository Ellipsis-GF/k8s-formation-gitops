# Cluster zonal (pas regional) : europe-west9 a 3 zones, et un cluster GKE
# regional exige un nombre de workers multiple de 3 par node pool. Pas de
# controlPlaneVersion fixe : GKE choisit la version par defaut du
# releaseChannel "regular".
# clusterNetwork explicite : sans lui, le controller CAPG v1.8.1 panique
# (nil pointer dereference dans createCluster) au moment de creer le
# cluster GKE.
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: GCPManagedControlPlane
metadata:
  name: cluster-a
  namespace: cluster-a
spec:
  project: k8s-formation
  location: europe-west9-a
  clusterName: cluster-a
  releaseChannel: regular
  clusterNetwork:
    useIPAliases: true
    pod:
      cidrBlock: 192.168.0.0/16
